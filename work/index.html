    <style>
      .lg-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .vgrid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
      }
      .vcard {
        position: relative;
        display: grid;
        justify-items: center;
        gap: 10px;
        padding: 20px 14px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--panel);
        cursor: pointer;
        text-align: center;
        transition: border-color 0.2s ease, transform 0.15s ease;
      }
      .vcard:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
      }
      .av {
        position: relative;
        width: 62px;
        height: 62px;
        border-radius: 50%;
        overflow: hidden;
        border: 1px solid var(--line-strong);
        background: linear-gradient(150deg, var(--accent-deep), var(--accent));
        display: grid;
        place-items: center;
      }
      .av span {
        color: #fff;
        font-family: var(--display-font);
        font-size: 22px;
        font-weight: 950;
      }
      .av img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .vcard .nk {
        font-size: 14px;
        font-weight: 900;
        line-height: 1.2;
      }
      .vcard .id {
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
      }
      .vcard .badge {
        display: inline-flex;
        align-items: baseline;
        gap: 3px;
        margin-top: 2px;
        padding: 4px 11px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.04em;
      }
      .vcard .badge b {
        font-family: var(--display-font);
        font-size: 14px;
      }
      /* modal breakdown */
      .vm-head {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 18px;
      }
      .vm-head .av {
        width: 54px;
        height: 54px;
      }
      .vm-head .nk {
        font-family: var(--display-font);
        font-size: 22px;
        font-weight: 950;
      }
      .vm-head .id {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }
      .brk {
        display: grid;
        gap: 0;
      }
      .brk > div {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 2px;
        border-top: 1px solid var(--line);
      }
      .brk .k {
        font-size: 14px;
        font-weight: 800;
      }
      .brk .ev {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      .brk .ev::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        content: "";
      }
      .brk .v {
        color: var(--accent);
        font-family: var(--display-font);
        font-size: 16px;
        font-weight: 950;
      }
      .brk .total {
        margin-top: 8px;
        border-top: 1px solid var(--line-strong);
      }
      .brk .total .k {
        letter-spacing: 0.08em;
      }
      @media (max-width: 720px) {
        .vgrid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>

    <main class="wrap">

    <div id="fx" aria-hidden="true"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../supabase.js"></script>
    <script src="../site.js"></script>
    <script src="../fx.js"></script>
    <script>
      (function () {
        "use strict";
        /* Sample ledger. counts keyed by type; 0/absent hidden in modal.
           NORMAL is the general 방셀; the rest are event 방셀. Replace via import. */
        var NORMAL = "일반";
        var EVENTS = ["어린이날", "여름 수영복", "크리스마스", "할로윈"];
        var VIEWERS = [
          { nk: "찌꺼기대장", id: "habilove1", c: { 일반: 5, "여름 수영복": 2, 크리스마스: 1 } },
          { nk: "밤톨", id: "nighttol", c: { 일반: 3, 어린이날: 1 } },
          { nk: "콜라단지", id: "cola_jar", c: { 일반: 8, 할로윈: 2, 크리스마스: 1 } },
          { nk: "단거요정", id: "sweetfae", c: { 일반: 2 } },
          { nk: "하비팬1호", id: "habifan01", c: { 일반: 6, 어린이날: 1, "여름 수영복": 1 } },
          { nk: "야식마왕", id: "latenite", c: { 할로윈: 3, 크리스마스: 2 } },
          { nk: "군것질러", id: "snackrun", c: { 일반: 4, "여름 수영복": 1 } },
          { nk: "점찍는사람", id: "moledot", c: { 일반: 1, 어린이날: 2 } },
          { nk: "필름감독", id: "reeldir", c: { 일반: 7, 할로윈: 1 } },
          { nk: "말랑벚꽃", id: "sakura_soft", c: { "여름 수영복": 3, 크리스마스: 1 } },
        ];

        function av(v, big) {
          var two = v.id.slice(0, 2);
          var url =
            "https://profile.img.sooplive.co.kr/LOGO/" +
            two +
            "/" +
            v.id +
            "/" +
            v.id +
            ".jpg";
          return (
            '<span>' +
            v.nk.slice(0, 1) +
            '</span><img referrerpolicy="no-referrer" src="' +
            url +
            '" alt="" onerror="this.style.display=\'none\'">'
          );
        }
        function total(v, kind) {
          var s = 0;
          for (var k in v.c) {
            if (kind === "normal" && k !== NORMAL) continue;
            if (kind === "event" && k === NORMAL) continue;
            s += v.c[k];
          }
          return s;
        }

        var grid = document.getElementById("grid");
        var empty = document.getElementById("empty");
        var count = document.getElementById("count");
        var qEl = document.getElementById("q");
        var segs = document.querySelectorAll("[data-tab]");
        var tab = "normal";

        function render() {
          var q = (qEl.value || "").trim().toLowerCase();
          var rows = VIEWERS.filter(function (v) {
            var okT = total(v, tab) > 0;
            var okQ =
              !q ||
              v.nk.toLowerCase().indexOf(q) > -1 ||
              v.id.toLowerCase().indexOf(q) > -1;
            return okT && okQ;
          }).sort(function (a, b) {
            return total(b, tab) - total(a, tab);
          });
          count.textContent = rows.length + " 명";
          empty.classList.toggle("hide", rows.length > 0);
          grid.innerHTML = rows
            .map(function (v) {
              return (
                '<div class="vcard" data-id="' +
                v.id +
                '"><div class="av">' +
                av(v) +
                '</div><div class="nk">' +
                v.nk +
                '</div><div class="id">@' +
                v.id +
                '</div><div class="badge"><b>' +
                total(v, tab) +
                "</b> 방셀</div></div>"
              );
            })
            .join("");
        }
        segs.forEach(function (b) {
          b.addEventListener("click", function () {
            tab = b.dataset.tab;
            segs.forEach(function (x) {
              x.classList.toggle("on", x === b);
            });
            render();
          });
        });
        qEl.addEventListener("input", render);

        grid.addEventListener("click", function (e) {
          var el = e.target.closest(".vcard");
          if (!el) return;
          var v = VIEWERS.find(function (x) {
            return x.id === el.dataset.id;
          });
          document.getElementById("vmAv").innerHTML = av(v);
          document.getElementById("vmNk").textContent = v.nk;
          document.getElementById("vmId").textContent = "@" + v.id;
          var order = [NORMAL].concat(EVENTS);
          var sum = 0;
          var rows = order
            .filter(function (k) {
              return v.c[k] > 0;
            })
            .map(function (k) {
              sum += v.c[k];
              return (
                '<div><span class="k ev">' +
                k +
                '</span><span class="v">×' +
                v.c[k] +
                "</span></div>"
              );
            });
          rows.push(
            '<div class="total"><span class="k">TOTAL</span><span class="v">' +
              sum +
              "</span></div>",
          );
          document.getElementById("vmBrk").innerHTML = rows.join("");
          window.__placeMask && window.__placeMask(document.getElementById("vm"));
          document.getElementById("vm").classList.add("open");
        });

        render();
        (async function () {
          try {
            if (typeof db !== "undefined" && db && typeof fetchAll === "function") {
              var vs = await fetchAll("viewers", { order: "sort_order", asc: true });
              if (vs && vs.length) {
                var types = await fetchAll("upbo_types", { order: "sort_order", asc: true });
                var counts = await fetchAll("upbo_counts", {});
                var typeById = {}, normalName = "일반", evNames = [];
                (types || []).forEach(function (t) {
                  typeById[t.id] = t.name;
                  if (t.category === "일반") normalName = t.name;
                  else evNames.push(t.name);
                });
                var byV = {};
                (counts || []).forEach(function (c) {
                  var tn = typeById[c.type_id];
                  if (!tn) return;
                  (byV[c.viewer_id] = byV[c.viewer_id] || {})[tn] = c.count;
                });
                NORMAL = normalName;
                EVENTS = evNames;
                VIEWERS = vs.map(function (v) {
                  return { nk: v.nickname || "", id: v.soop_id || "", c: byV[v.id] || {} };
                });
                render();
              }
            }
          } catch (e) {}
          document.body.classList.add("ready");
        })();
      })();
    </script>
  </body>
